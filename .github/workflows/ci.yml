name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt ruff
      # Scoped to pyflakes (F): unused imports/vars, undefined names, redefinitions.
      # Ruff's fuller default rulesets (UP/B/BLE/TRY/S/...) are opinionated
      # style/architecture rules the codebase doesn't follow yet -- turning
      # those on is a separate cleanup, not part of standing CI up.
      - run: ruff check app/ --select F
      - run: python -m pytest tests/ -v
        env:
          SUPABASE_URL: http://localhost:54321
          # supabase-py validates key shape, so it must look like a JWT; value is fake
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJzZXJ2aWNlX3JvbGUiLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MjAwMDAwMDAwMH0.fake-signature-for-ci-only
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzAwMDAwMDAwLCJleHAiOjIwMDAwMDAwMDB9.fake-signature-for-ci-only
          SUPABASE_JWT_SECRET: test-jwt-secret

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
        env:
          # public values — they ship in the client bundle anyway
          NEXT_PUBLIC_SANITY_PROJECT_ID: ecreghoz
          NEXT_PUBLIC_SANITY_DATASET: production
